<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf7fc"/>
      <stop offset="0.52" stop-color="#f5fbfe"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d5b9f"/>
      <stop offset="1" stop-color="#123a70"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f7fb"/>
      <stop offset="1" stop-color="#f6fbfd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Manrope, 'Noto Sans Devanagari', Arial, sans-serif; }
      .ink { fill: #111827; }
      .muted { fill: #64748b; }
      .small { font-size: 12px; }
      .label { font-size: 10px; font-weight: 800; letter-spacing: 1.1px; }
      .brandText { fill: #d8292f; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#f1f5f9"/>
  <text x="48" y="58" class="ink" font-size="28" font-weight="800">WHITE FOAM · CANVA UI BOARD</text>
  <text x="48" y="86" class="muted" font-size="13">Responsive homepage concept · desktop and mobile · product-first, readable, practical</text>
  <rect x="48" y="105" width="54" height="4" rx="2" fill="#f2c52c"/>

